name: Injury report

on:
  schedule:
    - cron: "15 */3 * * *"      # every 3 hours, all week
    - cron: "30 21,23 * * 5"    # extra runs Friday evening, after final game statuses
  workflow_dispatch:            # the "Run workflow" button on the Actions tab

permissions:
  contents: write

concurrency:
  group: injury-report
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the injury report
        run: |
          mkdir -p data
          python build.py

      - name: Save it if anything changed
        run: |
          git config user.name "ffd-bot"
          git config user.email "ffd-bot@users.noreply.github.com"
          git add data/injury-report.json data/practice-log.json
          if git diff --cached --quiet; then
            echo "No change."
          else
            git commit -m "Injury report update"
            git push
          fi
